name: paper-bot

# Paper trading only: no API keys, no real orders. Runs one check every ~15 minutes
# (GitHub may delay scheduled runs by several minutes), then commits state + dashboard data.
on:
  schedule:
    # off-peak minutes: GitHub drops/delays many runs scheduled at :00/:15/:30/:45
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # optional: alerts are skipped when these repository secrets are not set
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run one paper-trading check (Donchian 4h)
        run: python bot.py --mode paper --once

      - name: Run one paper-trading check (EMA 9/21 90m)
        run: python bot.py --mode paper --once --strategy ema90

      - name: Export dashboard data
        run: python export_dashboard.py

      - name: Save state
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs
          for f in state_paper*.json trades*.csv signals*.csv; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -q -m "paper tick $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q

      - name: Send Telegram test alert
        if: ${{ inputs.test_alert }}
        continue-on-error: true
        run: python notify.py "Delta paper bot connected. You'll get a message here on every entry, stop move and exit."
