name: paper-bot

# Paper trading only: no API keys, no real orders. Runs one check every ~15 minutes
# (GitHub may delay scheduled runs by several minutes), then commits state + dashboard data.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run one paper-trading check
        run: python bot.py --mode paper --once

      - name: Export dashboard data
        run: python export_dashboard.py

      - name: Save state
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state_paper.json docs
          [ -f trades.csv ] && git add trades.csv
          [ -f signals.csv ] && git add signals.csv
          git diff --cached --quiet && exit 0
          git commit -q -m "paper tick $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q
