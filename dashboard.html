<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper bots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #F6F6F4; --ink: #1A1C20; --muted: #70747C; --rule: #E2E2DE;
    --gain: #1E7650; --loss: #B03A33; --accent: #3446C9; --line2: #9AA0AA;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131416; --ink: #E9EAEC; --muted: #8E939B; --rule: #27292E;
      --gain: #46BD8C; --loss: #E2706A; --accent: #93A0FF; --line2: #5D626B; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Geist", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  header { display: flex; align-items: baseline; gap: 28px; padding: 22px 0 0; flex-wrap: wrap; }
  .name { font-weight: 600; }
  nav { display: flex; gap: 20px; flex: 1; }
  nav button { background: none; border: 0; padding: 2px 0; color: var(--muted); cursor: pointer;
    border-bottom: 1px solid transparent; white-space: nowrap; }
  nav button:hover { color: var(--ink); }
  nav button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .px { display: flex; align-items: baseline; gap: 8px; }
  #live { width: 6px; height: 6px; border-radius: 50%; background: var(--line2); align-self: center; }
  #live.on { background: var(--gain); }
  #mark { font-weight: 500; transition: color .4s; }
  #mark.up { color: var(--gain); } #mark.down { color: var(--loss); }

  .hero { padding: 64px 0 40px; }
  #equity { font-size: clamp(48px, 9vw, 84px); font-weight: 400; letter-spacing: -0.035em; line-height: 1; }
  #say { font-size: clamp(19px, 2.4vw, 24px); line-height: 1.35; margin: 22px 0 0; max-width: 34em; }
  #meta { color: var(--muted); margin: 10px 0 0; }
  #meta .bad { color: var(--loss); }

  #chart { height: 380px; }
  .legend { color: var(--muted); font-size: 13px; padding: 10px 0 0; display: flex; gap: 18px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }

  dl.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 22px 32px;
    margin: 56px 0 0; padding: 26px 0 0; border-top: 1px solid var(--rule); }
  dl.stats div { min-width: 0; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 4px 0 0; font-size: 20px; }
  #curvebox { margin-top: 28px; } #curve { height: 120px; }

  section { margin-top: 64px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  h2 small { font-weight: 400; color: var(--muted); font-size: 15px; margin-left: 10px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 10px 0 10px 18px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th { font-weight: 400; color: var(--muted); font-size: 13px; }
  .g { color: var(--gain); } .r { color: var(--loss); } .m { color: var(--muted); }
  .empty { color: var(--muted); padding: 14px 0; }
  details summary { cursor: pointer; font-weight: 600; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: " +"; color: var(--muted); font-weight: 400; }
  details[open] summary::after { content: " −"; }
  details summary span { font-weight: 400; color: var(--muted); margin-left: 10px; }
  details .scroll { margin-top: 12px; }
  #err { color: var(--loss); margin-top: 24px; display: none; }
  footer { color: var(--muted); font-size: 13px; padding: 72px 0 40px; max-width: 46em; }

  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    header { gap: 14px; }
    nav { order: 3; flex-basis: 100%; gap: 18px; overflow-x: auto; }
    .px { margin-left: auto; }
    .hero { padding: 40px 0 28px; }
    #chart { height: 280px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="name">Paper bots</span>
    <nav id="tabs" aria-label="View">
      <button data-m="paper" aria-pressed="true">Donchian 4h</button>
      <button data-m="paper_ema90" aria-pressed="false">EMA 90m</button>
      <button data-m="testnet" aria-pressed="false">Testnet</button>
      <button data-m="live" aria-pressed="false">Live</button>
      <button data-m="backtest" aria-pressed="false">Backtest</button>
    </nav>
    <span class="px" title="ETHUSD mark price, streamed from Delta Exchange">
      <span id="live"></span><span class="m">ETH</span><span id="mark">—</span>
    </span>
  </header>

  <div class="hero">
    <div id="equity">—</div>
    <p id="say">Loading…</p>
    <p id="meta"></p>
    <p id="err" role="alert"></p>
  </div>

  <div id="chart"></div>
  <div class="legend" id="legend"></div>

  <dl class="stats" id="stats"></dl>
  <div id="curvebox"><div id="curve"></div></div>

  <section>
    <h2>Trades <small id="tcount"></small></h2>
    <div class="scroll"><table id="trades"></table></div>
  </section>

  <section id="sigpanel">
    <details>
      <summary>Signal log<span id="sigsub"></span></summary>
      <div class="scroll"><table id="signals"></table></div>
    </details>
  </section>

  <footer>Paper trading on live Delta Exchange prices. The price and open-position P&amp;L update live; trades and signals update every 15 minutes. P&amp;L includes taker fees and 18% GST and is an estimate.</footer>
</div>

<script>
const $ = id => document.getElementById(id);
// Served by dashboard.py locally -> live API. Hosted online (Vercel) -> JSON snapshots written by the cloud bot.
const STATIC = !["127.0.0.1", "localhost"].includes(location.hostname);
// The cloud bot commits fresh JSON here every ~15 min, so the hosted page never needs redeploying.
const DATA_URL = "https://raw.githubusercontent.com/EPFRAGHU/delta-paper-bot/main/docs/data";
const ONLINE_VIEWS = ["paper", "paper_ema90", "backtest"];  // views the cloud bot exports
let mode = new URLSearchParams(location.search).get("mode") || "paper";
if (STATIC && !ONLINE_VIEWS.includes(mode)) mode = "paper";
let chart, candleS, lineS = [], stopLine, curveChart, curveS, fitted = {};
let lastData = null, liveBar = null;
const live = { mark: 0, last: 0, at: 0 };
const CV = 0.01;  // ETHUSD contract = 0.01 ETH

const num = (v, d = 2) => v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
// ⁠ (word joiner) keeps a sign glued to its amount when text wraps
const usd = (v, d = 2) => v == null ? "—" : (v < 0 ? "−⁠$" : "$") + num(Math.abs(v), d);
const sgn = (v, d = 2) => v == null ? "—" : (v > 0 ? "+⁠" : v < 0 ? "−⁠" : "") + "$" + num(Math.abs(v), d);
const pct = (v, d = 1) => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v), d) + "%";
const cls = v => v > 0 ? "g" : v < 0 ? "r" : "";
const ts = t => t ? new Date(t * 1000).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const ago = t => { const m = Math.round((Date.now() / 1000 - t) / 60); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };
const dur = (a, b) => { if (!a || !b) return "—"; const h = (b - a) / 3600; return h >= 48 ? (h / 24).toFixed(1) + " d" : h.toFixed(0) + " h"; };
const sideWord = s => s > 0 ? "Long" : "Short";
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function chartTheme() {
  return { layout: { background: { color: css("--bg") }, textColor: css("--muted"), fontFamily: "Geist, system-ui, sans-serif" },
    grid: { vertLines: { visible: false }, horzLines: { visible: false } },
    // tiny minimum bar spacing so the 2.5-year backtest fits on a phone screen
    rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false, timeVisible: true, minBarSpacing: 0.02 },
    crosshair: { mode: 0, vertLine: { color: css("--rule") }, horzLine: { color: css("--rule") } } };
}
function makeCharts() {
  chart = LightweightCharts.createChart($("chart"), { ...chartTheme(), autoSize: true });
  candleS = chart.addCandlestickSeries({ borderVisible: false });
  for (let k = 0; k < 3; k++) lineS.push(chart.addLineSeries({ lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }));
  curveChart = LightweightCharts.createChart($("curve"), { ...chartTheme(), autoSize: true, handleScroll: false, handleScale: false });
  curveS = curveChart.addLineSeries({ lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
  paintCharts();
}
function paintCharts() {
  chart.applyOptions(chartTheme()); curveChart.applyOptions(chartTheme());
  candleS.applyOptions({ upColor: css("--gain"), downColor: css("--loss"), wickUpColor: css("--gain"), wickDownColor: css("--loss"),
    priceLineColor: css("--line2"), priceLineStyle: 1 });
  curveS.applyOptions({ color: css("--ink") });
  if (lastData) render(lastData);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintCharts);

function barTime(t, candles, step) {
  // snap a timestamp to the candle it falls in, so markers sit on a bar
  const b = Math.floor(t / step) * step;
  return candles.length && b < candles[0].time ? null : b;
}

function render(d) {
  $("err").style.display = "none";
  lastData = d;
  if (d.mode !== "backtest" && live.mark) withLive(d);  // never let a 15-min-old snapshot overwrite a live tick
  setPrice(d.mark);
  renderHero(d);

  // price chart; lines map onto the strategy's own indicators (server order: EMA 200 first)
  const c = d.chart, p = d.position, step = d.bar_sec || 14400;
  candleS.setData(c.candles);
  const palette = [css("--ink"), css("--accent"), css("--line2")];
  lineS.forEach((s, k) => {
    const ln = c.lines[k];
    const color = ln && ln.dash ? css("--line2") : palette[k];
    s.applyOptions({ visible: !!ln, color, lineStyle: ln && ln.dash ? 2 : 0, lineWidth: 1 });
    s.setData(ln ? ln.data : []);
    if (ln) ln.shown = color;
  });
  $("legend").innerHTML = c.lines.filter(l => !/low$/.test(l.name)).map(l =>
    `<span><i style="background:${l.shown}"></i>${l.name.replace(/ high$/, " high and low").replace(" (trend filter)", "")}</span>`).join("")
    + `<span><i style="background:${css("--gain")}"></i>Entry</span><span><i style="background:${css("--muted")}"></i>Exit</span>`;
  liveBar = d.mode !== "backtest" && c.candles.length ? { ...c.candles[c.candles.length - 1] } : null;
  const marks = [];
  for (const t of d.trades) {
    const ti = t.entry_time && barTime(t.entry_time, c.candles, step), to = barTime(t.exit_time, c.candles, step);
    if (ti) marks.push({ time: ti, position: t.side > 0 ? "belowBar" : "aboveBar", color: css("--gain"),
      shape: t.side > 0 ? "arrowUp" : "arrowDown", text: "" });
    if (to) marks.push({ time: to, position: t.side > 0 ? "aboveBar" : "belowBar", color: css("--muted"), shape: "circle", text: "" });
  }
  if (p && p.opened) { const ti = barTime(p.opened, c.candles, step); if (ti) marks.push({ time: ti, position: p.side > 0 ? "belowBar" : "aboveBar", color: css("--gain"), shape: p.side > 0 ? "arrowUp" : "arrowDown", text: "" }); }
  marks.sort((a, b) => a.time - b.time);
  candleS.setMarkers(marks);
  if (stopLine) { candleS.removePriceLine(stopLine); stopLine = null; }
  if (p) stopLine = candleS.createPriceLine({ price: p.stop, color: css("--loss"), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "stop" });
  if (!fitted[d.mode]) {
    const n = c.candles.length;
    if (d.mode === "backtest") chart.timeScale().fitContent();
    else if (n) chart.timeScale().setVisibleLogicalRange({ from: n - 160, to: n + 4 });
    fitted = { [d.mode]: true };
  }
  $("curvebox").style.display = d.trades.length ? "" : "none";
  curveS.setData(d.curve || []); curveChart.timeScale().fitContent();

  renderStats(d);
  renderTables(d);
}

function setPrice(v) {
  const el = $("mark"), prev = parseFloat(el.dataset.v || "0");
  el.textContent = v ? num(v) : "—";
  el.dataset.v = v || 0;
  if (prev && v !== prev) el.className = v > prev ? "up" : "down";
}

function renderHero(d) {
  const p = d.position, s = d.stats || {};
  $("equity").textContent = usd(d.equity);
  let say;
  if (d.mode === "backtest") say = "Simulated on past 4h candles with the same rules, fees and sizing as the live bot.";
  else if (d.halted) say = "Halted after a 25% drawdown. No new trades until you review it.";
  else if (p) say = `${sideWord(p.side)} ${p.qty} contract${p.qty > 1 ? "s" : ""} from ${num(p.entry)}, ${sgn(p.upnl)} so far. Stop at ${num(p.stop)}.`;
  else say = `Flat. ${d.waiting_for || "Waiting for an entry signal."}`;
  $("say").textContent = say;

  const parts = [];
  if (d.mode === "backtest") {
    parts.push(`${s.trades} trades, ${pct(s.return_pct)} return`);
    if (d.buy_hold_pct != null) parts.push(`ETH buy and hold ${pct(d.buy_hold_pct)} over the same period`);
  } else {
    parts.push(s.trades ? `${sgn(s.net_pnl)} realised over ${s.trades} trade${s.trades > 1 ? "s" : ""}` : "No trades yet");
    if (d.bot_alive) parts.push(`checked ${ago(d.heartbeat)}`);
    else parts.push(`<span class="bad">${d.heartbeat ? "bot stopped, last check " + ago(d.heartbeat) : "bot not started"}</span>`);
  }
  $("meta").innerHTML = parts.join(", ").replace(/^./, ch => ch.toUpperCase()) + ".";
}

function renderStats(d) {
  const s = d.stats || {}, p = d.position;
  const items = [
    ["Win rate", s.trades ? num(s.win_rate, 0) + "%" : "—"],
    ["Profit factor", s.profit_factor != null ? num(s.profit_factor) : "—"],
    ["Max drawdown", s.trades ? num(s.max_dd_pct, 1) + "%" : "—"],
    ["Best trade", s.trades ? sgn(s.best) : "—", cls(s.best)],
    ["Worst trade", s.trades ? sgn(s.worst) : "—", cls(s.worst)],
    ["Fees", s.trades ? usd(s.fees) : "—"],
  ];
  if (p) items.unshift(["Open P&L", sgn(p.upnl), cls(p.upnl)], ["Leverage used", p.eff_leverage ? num(p.eff_leverage) + "×" : "—"]);
  $("stats").innerHTML = items.map(([k, v, c]) => `<div><dt>${k}</dt><dd class="${c || ""}">${v}</dd></div>`).join("");
}

// open-position figures change every tick; the hero and stats are the only places that show them
function renderPos(d) { renderHero(d); }
function renderKpis(d) { renderStats(d); }

function renderTables(d) {
  $("tcount").textContent = d.trades.length ? `${d.trades.length}` : "";
  $("trades").innerHTML = d.trades.length ? `<tr><th>Opened</th><th>Side</th><th>Size</th><th>Entry</th><th>Exit</th><th>Held</th><th>Closed by</th><th>P&amp;L</th></tr>` +
    d.trades.map(t => `<tr><td>${ts(t.entry_time)}</td><td>${sideWord(t.side)}</td><td>${t.qty}</td><td>${num(t.entry)}</td>
      <td>${num(t.exit)}</td><td>${dur(t.entry_time, t.exit_time)}</td><td class="m">${t.reason}</td>
      <td class="${cls(t.pnl)}">${sgn(t.pnl)}</td></tr>`).join("")
    : `<tr><td class="empty">No closed trades yet.${d.mode === "paper" ? " The Backtest view shows what trades look like." : ""}</td></tr>`;

  const step = d.bar_sec || 14400;
  $("sigpanel").style.display = d.mode === "backtest" ? "none" : "";
  $("sigsub").textContent = `one row per ${step >= 3600 ? step / 3600 + "h" : step / 60 + "m"} candle while flat`;
  $("signals").innerHTML = d.signals.length ? `<tr><th>Candle close (UTC)</th><th>Close</th><th>EMA 200</th><th>ADX</th><th>ATR</th><th>Signal</th></tr>` +
    d.signals.map(r => { const sg = +r.signal; return `<tr><td>${r.time.replace("T", " ").slice(0, 16)}</td><td>${num(+r.close)}</td>
      <td class="${+r.close > +r.ema200 ? "" : "m"}">${num(+r.ema200)}</td><td>${num(+r.adx, 1)}</td><td>${num(+r.atr)}</td>
      <td class="${sg ? "" : "m"}">${sg > 0 ? "Buy" : sg < 0 ? "Sell" : "None"}</td></tr>`; }).join("")
    : `<tr><td class="empty">Nothing logged yet.</td></tr>`;
}

// --- live prices: Delta India public websocket, REST polling as fallback -------------------------
function withLive(d) {
  // overlay the latest tick on a snapshot: mark price and the open position's P&L
  d.mark = live.mark;
  const p = d.position;
  if (p) {
    p.mark = live.mark;
    p.upnl = p.side * (live.mark - p.entry) * p.qty * CV;
    p.upnl_pct = 100 * p.upnl / (p.entry * p.qty * CV);
    p.notional = p.qty * CV * live.mark;
    p.risk_to_stop = p.side * (p.stop - live.mark) * p.qty * CV;
    p.eff_leverage = d.equity ? p.notional / d.equity : null;
  }
  return d;
}

function onTick(mark, last) {
  live.mark = mark; live.last = last || mark; live.at = Date.now();
  $("live").className = "on";
  if (!lastData || lastData.mode === "backtest") return;
  withLive(lastData);
  setPrice(live.mark);
  if (lastData.position) { renderPos(lastData); renderKpis(lastData); }
  // grow the forming candle with the last traded price
  const step = lastData.bar_sec || 14400, bar = Math.floor(Date.now() / 1000 / step) * step;
  if (!liveBar || liveBar.time < bar) liveBar = { time: bar, open: live.last, high: live.last, low: live.last, close: live.last };
  liveBar.close = live.last;
  liveBar.high = Math.max(liveBar.high, live.last);
  liveBar.low = Math.min(liveBar.low, live.last);
  candleS.update(liveBar);
}

let ws, pollTimer;
function connectLive() {
  try { ws = new WebSocket("wss://socket.india.delta.exchange"); } catch { return startPolling(); }
  ws.onopen = () => {
    stopPolling();
    ws.send(JSON.stringify({ type: "subscribe", payload: { channels: [{ name: "v2/ticker", symbols: ["ETHUSD"] }] } }));
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "v2/ticker" && m.symbol === "ETHUSD") onTick(+m.mark_price, +m.close);
  };
  ws.onclose = () => { $("live").className = ""; startPolling(); setTimeout(connectLive, 5000); };
  ws.onerror = () => ws.close();
}
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    try {
      const t = (await (await fetch("https://api.india.delta.exchange/v2/tickers/ETHUSD")).json()).result;
      onTick(+t.mark_price, +t.close);
    } catch { $("live").className = ""; }
  }, 3000);
}
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
// if ticks stop arriving for 20s, show the feed as stale
setInterval(() => { if (Date.now() - live.at > 20000) $("live").className = ""; }, 5000);

async function load() {
  const want = mode;
  try {
    const r = await fetch(STATIC ? `${DATA_URL}/${want}.json?t=${Date.now()}` : "/api/data?mode=" + want);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    if (want !== mode) return;  // user switched views while this request was in flight
    render(d);
  } catch (e) {
    $("err").style.display = "block";
    $("err").textContent = `Couldn't load bot data (${e.message}). ` + (STATIC ? "The cloud bot may not have run yet; this page retries every minute." : "Start dashboard.py and reload.");
  }
}

document.querySelectorAll("#tabs button").forEach(b => {
  if (STATIC && !ONLINE_VIEWS.includes(b.dataset.m)) { b.remove(); return; }
  b.setAttribute("aria-pressed", b.dataset.m === mode);
  b.onclick = () => {
    mode = b.dataset.m;
    document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
    history.replaceState(null, "", "?mode=" + mode);
    load();
  };
});
makeCharts();
load();
connectLive();
setInterval(() => { if (mode !== "backtest") load(); }, STATIC ? 60000 : 5000);
</script>
</body>
</html>
